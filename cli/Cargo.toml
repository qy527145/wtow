[package]
name = "wtow-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
contract = { version = "0.1.0", path = "../contract" }
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "blocking", "multipart", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
