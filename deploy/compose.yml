# 生产部署：Postgres + wtow 服务端。由 scripts/deploy.ts 推到服务器的 <remote-dir> 后执行。
# 配置来自同目录的 .env（首次部署自动生成，之后人工维护）。
name: wtow

services:
  db:
    # 默认用服务器上已有的 postgres:17；本地没有时才走 1ms 镜像源拉取，避免直连 Docker Hub。
    image: ${WTOW_PG_IMAGE:-postgres:17}
    pull_policy: missing
    container_name: wtow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wtow
      POSTGRES_USER: wtow
      POSTGRES_PASSWORD: ${WTOW_PG_PASSWORD:?WTOW_PG_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtow -d wtow"]
      interval: 5s
      timeout: 3s
      retries: 24
    # 只留给本机排查（psql / 备份），不对公网暴露。
    ports:
      - "127.0.0.1:${WTOW_PG_PORT:-15432}:5432"

  app:
    # 构建上下文是 image/，里面只有 Dockerfile 和交叉编译好的二进制；
    # data/ 是附件，绝不能进构建上下文。
    build:
      context: ./image
    image: wtow-server:${WTOW_IMAGE_TAG:-latest}
    container_name: wtow-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wtow:${WTOW_PG_PASSWORD}@db:5432/wtow
      WTOW_BIND: 0.0.0.0:8080
      WTOW_PUBLIC_BASE_URL: ${WTOW_PUBLIC_BASE_URL:?WTOW_PUBLIC_BASE_URL is required}
      WTOW_ATTACHMENT_DIR: /data/attachments
      WTOW_RELEASE_DIR: /data/releases
      RUST_LOG: ${RUST_LOG:-wtow_server=info}
      WTOW_SUPERADMIN_EMAILS: ${WTOW_SUPERADMIN_EMAILS:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data
    ports:
      - "${WTOW_HOST_BIND:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
