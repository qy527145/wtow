[workspace]
resolver = "3"
members = ["apps/server", "apps/cli", "crates/contract"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.6.0"
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
contract = { version = "0.1.0", path = "crates/contract" }
dirs = "7.0.0"
dotenvy = "0.15.7"
hex = "0.4.3"
infer = "0.22.0"
mime_guess = "2.0.5"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "blocking", "multipart", "query"] }
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "json"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde-json-impl"] }

# 单二进制优先：体积与启动速度比极限吞吐更重要。
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
